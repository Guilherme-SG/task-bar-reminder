<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Reminder</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: transparent;
      overflow: hidden;
      color: #e6e6e6;
      height: 100vh;
    }

    .stack {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }

    .card {
      width: 280px;
      padding: 16px;
      border-radius: 14px;
      background: var(--card-bg, rgba(22, 26, 34, 0.95));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .title {
      font-size: 16px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .description {
      font-size: 13px;
      opacity: 0.6;
      margin-bottom: 14px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.15s ease;
    }

    .primary {
      background: var(--card-bg, #3b82f6);
      color: white;
    }

    .primary:hover {
      filter: brightness(1.15);
    }

    .secondary {
      background: #2a2f3a;
      color: #e6e6e6;
    }

    .secondary:hover {
      background: #353c4a;
    }
  </style>
</head>

<body>
  <div class="stack" id="stack"></div>

  <script>
    const { ipcRenderer } = require('electron');
    const stack = document.getElementById('stack');

    ipcRenderer.on('show-reminder', (_, data) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = data.id;
      card.style.setProperty('--card-bg', data.color);

      const desc = data.description
        ? `<div class="description">${data.description}</div>`
        : '';

      card.innerHTML = `
        <div class="title">${data.title}</div>
        ${desc}
        <div class="buttons">
          <button class="primary" data-action="done">Done</button>
          <button class="secondary" data-action="snooze">Snooze</button>
        </div>
      `;

      card.querySelector('[data-action="done"]').onclick = () => {
        ipcRenderer.send('reminder-action', data.id, 'done');
        card.remove();
      };

      card.querySelector('[data-action="snooze"]').onclick = () => {
        ipcRenderer.send('reminder-action', data.id, 'snooze');
        card.remove();
      };

      stack.appendChild(card);
    });

    ipcRenderer.on('remove-reminder', (_, reminderId) => {
      const card = stack.querySelector(`[data-id="${reminderId}"]`);
      if (card) card.remove();
    });
  </script>
</body>

</html>
